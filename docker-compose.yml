version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: road700-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: road700-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      MAX_DOCUMENT_UPLOAD_SIZE_BYTES: ${MAX_DOCUMENT_UPLOAD_SIZE_BYTES}
      MAX_IMPORT_UPLOAD_SIZE_BYTES: ${MAX_IMPORT_UPLOAD_SIZE_BYTES}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_LOGIN_RATE_LIMIT_MAX_PER_IP: ${AUTH_LOGIN_RATE_LIMIT_MAX_PER_IP}
      AUTH_LOGIN_RATE_LIMIT_MAX_PER_LOGIN: ${AUTH_LOGIN_RATE_LIMIT_MAX_PER_LOGIN}
      AUTH_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_IP: ${AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_IP}
      AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_EMAIL: ${AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_EMAIL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME}
      INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 8
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: road700-worker
    restart: unless-stopped
    command: ["python", "-m", "app.scripts.run_job_worker"]
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      MAX_DOCUMENT_UPLOAD_SIZE_BYTES: ${MAX_DOCUMENT_UPLOAD_SIZE_BYTES}
      MAX_IMPORT_UPLOAD_SIZE_BYTES: ${MAX_IMPORT_UPLOAD_SIZE_BYTES}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_LOGIN_RATE_LIMIT_MAX_PER_IP: ${AUTH_LOGIN_RATE_LIMIT_MAX_PER_IP}
      AUTH_LOGIN_RATE_LIMIT_MAX_PER_LOGIN: ${AUTH_LOGIN_RATE_LIMIT_MAX_PER_LOGIN}
      AUTH_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_IP: ${AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_IP}
      AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_EMAIL: ${AUTH_PASSWORD_RESET_RATE_LIMIT_MAX_PER_EMAIL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME}
      INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: road700-frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
